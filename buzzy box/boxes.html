<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzzy Box Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Welcome to Buzzy Box</h1>
    <p>Creative boxes with images</p>
  </header>

  <section class="gallery">
    <div class="box">
      <img src="images/image1.jpg" alt="Buzz Mode">
      <h3>Buzz Mode</h3>
      <p>Fun animations and sounds to energize your experience.</p>
    </div>

    <div class="box">
      <img src="images\image2.jpg" alt="Idea Vault">
      <h3>Idea Vault</h3>
      <p>Store and organize your buzzing thoughts in one place.</p>
    </div>

    <div class="box">
      <img src="images\image3.jpg" alt="Creative Hub">
      <h3>Creative Hub</h3>
      <p>Collaborate and share your ideas with others.</p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Buzzy Box. All rights reserved.</p>
  </footer>
</body>
</html>
